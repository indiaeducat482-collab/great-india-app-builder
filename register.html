<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Great India App Builder</title>
<link rel="icon" href="./assets/logo.svg"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/auth.css"></head>
<body class="auth-page"><a class="auth-brand" href="./index.html"><img src="./assets/logo.svg" alt="">Great India <b>App Builder</b></a>
<main class="auth-shell"><section class="auth-card"><div class="auth-head"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Start building and managing your Android app projects.</p></div>
<div id="message" class="message" hidden></div><form id="registerForm"><label>Full Name<input id="fullName" type="text" autocomplete="name" required placeholder="Your full name"></label><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<div class="password-wrap"><input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters"><button type="button" class="toggle-pass" data-target="password">Show</button></div></label><label>Confirm Password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your password"></label>
<button id="registerBtn" class="btn btn-primary btn-block" type="submit">Create Account</button></form><p class="auth-foot">Already have an account? <a href="./login.html">Login</a></p></section></main>
<script type="module" src="./js/auth.js"></script></body></html>
