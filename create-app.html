<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create App</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><header class="topbar"><div class="brand">Great India <span>App Builder</span></div><a href="dashboard.html" class="btn">Dashboard</a></header>
<main class="container narrow"><div class="card"><h1>Create your app</h1><p>Enter your website details.</p><form id="appForm">
<label>App name<input id="appName" placeholder="My Business App" required></label>
<label>Website URL<input id="website" type="url" placeholder="https://example.com" required></label>
<label>Platform<select id="platform"><option value="android">Android</option><option value="ios">iOS</option><option value="both">Android + iOS</option></select></label>
<label>Package name<input id="package" placeholder="com.example.myapp"></label>
<label>Description<textarea id="description" rows="4"></textarea></label>
<button class="btn primary" type="submit">Create App</button></form><div id="msg"></div></div></main><script type="module" src="assets/js/create-app.js"></script></body></html>
