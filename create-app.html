<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create App | Great India App Builder</title><link rel="icon" href="./assets/logo.svg"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/dashboard.css"></head><body class="app-page"><div id="toast" class="toast"></div><aside class="sidebar"><a class="side-brand" href="./dashboard.html"><img src="./assets/logo.svg" alt=""><span>Great India<br><b>App Builder</b></span></a><nav class="side-nav"><a href="./dashboard.html">⌂ <span>Dashboard</span></a><a class="active" href="./create-app.html">＋ <span>Create New App</span></a><a href="./my-apps.html">▣ <span>My Apps</span></a><a href="./dashboard.html#profile">◉ <span>Profile</span></a></nav><button id="logoutBtn" class="logout">↪ <span>Logout</span></button></aside><div class="mobile-top"><a class="side-brand" href="./dashboard.html"><img src="./assets/logo.svg" alt=""><b>App Builder</b></a></div><div class="app-main"><header class="topbar"><div><span class="eyebrow">PROJECT SETUP</span><h1 id="pageTitle">Create New App</h1></div></header><main class="content"><div id="message" class="message" hidden></div><form id="appForm" class="builder-form"><section class="panel"><div class="form-grid"><label>App Name<input id="appName" required maxlength="80"></label><label>Website URL<input id="websiteUrl" type="url" required placeholder="https://example.com"></label><label>Package Name<input id="packageName" required pattern="^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$"></label><label>Version<input id="version" required value="1.0.0" pattern="^\d+\.\d+\.\d+$"></label><label>Theme<select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto</option></select></label></div></section><section class="panel"><div class="upload-grid"><label class="upload-box"><strong>App Logo</strong><small>PNG/JPG/WEBP/SVG</small><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><label class="upload-box"><strong>App Icon</strong><small>PNG/JPG/WEBP</small><input id="iconFile" type="file" accept="image/png,image/jpeg,image/webp"></label></div></section><div class="form-actions"><a class="btn btn-ghost" href="./my-apps.html">Cancel</a><button id="previewBtn" class="btn btn-ghost" type="button">Preview</button><button id="saveBtn" class="btn btn-primary" type="submit">Save App</button></div></form></main></div><script type="module" src="./js/create-app.js"></script></body></html>
