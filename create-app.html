<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create App | Great India App Builder</title>
<link rel="icon" href="./assets/logo.svg"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/dashboard.css"></head>
<body class="app-page"><div id="toast" class="toast"></div><aside class="sidebar"><a class="side-brand" href="./dashboard.html"><img src="./assets/logo.svg" alt=""><span>Great India<br><b>App Builder</b></span></a><nav class="side-nav"><a href="./dashboard.html">⌂ <span>Dashboard</span></a><a class="active" href="./create-app.html">＋ <span>Create New App</span></a><a href="./my-apps.html">▣ <span>My Apps</span></a><a href="./dashboard.html#profile">◉ <span>Profile</span></a></nav><button id="logoutBtn" class="logout">↪ <span>Logout</span></button></aside>
<div class="mobile-top"><a class="side-brand" href="./dashboard.html"><img src="./assets/logo.svg" alt=""><b>App Builder</b></a><button id="menuBtn">☰</button></div>
<div class="app-main"><header class="topbar"><div><span class="eyebrow">PROJECT SETUP</span><h1 id="pageTitle">Create New App</h1></div></header><main class="content"><div id="firebaseNotice" class="notice" hidden></div><form id="appForm" class="builder-form">
<section class="panel"><div class="panel-head"><div><h2>App details</h2><p>These values are stored in your private project.</p></div></div><div class="form-grid"><label>App Name<input id="appName" required maxlength="80" placeholder="My Business"></label><label>Website URL<input id="websiteUrl" type="url" required placeholder="https://example.com"></label><label>Package Name<input id="packageName" required placeholder="com.greatindia.mybusiness" pattern="^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$"></label><label>Version<input id="version" required value="1.0.0" pattern="^\d+\.\d+\.\d+$" placeholder="1.0.0"></label><label>Theme<select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Auto</option></select></label></div></section>
<section class="panel"><div class="panel-head"><div><h2>Branding</h2><p>Upload a logo and app icon. Images are stored in Firebase Storage.</p></div></div><div class="upload-grid"><label class="upload-box"><span class="upload-icon">▧</span><strong>App Logo</strong><small>PNG, JPG, SVG • recommended 512×512</small><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label><label class="upload-box"><span class="upload-icon">◈</span><strong>App Icon</strong><small>PNG, JPG, WEBP • recommended 512×512</small><input id="iconFile" type="file" accept="image/png,image/jpeg,image/webp"></label></div><div id="imagePreview" class="image-preview" hidden></div></section>
<div class="form-actions"><a class="btn btn-ghost" href="./my-apps.html">Cancel</a><button id="previewBtn" class="btn btn-ghost" type="button">Preview</button><button id="saveBtn" class="btn btn-primary" type="submit">Save App</button></div></form></main></div><script type="module" src="./js/create-app.js"></script></body></html>
