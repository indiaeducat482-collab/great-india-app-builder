<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upgrade Limit</title><style>body{margin:0;background:#f4f7fb;font-family:system-ui;color:#172033}.card{max-width:520px;margin:50px auto;background:#fff;padding:24px;border-radius:18px;border:1px solid #e2e7ee}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #d4dae3;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#087f5b;color:#fff;font-weight:900}.msg{margin-top:12px;padding:10px;border-radius:9px}</style></head><body><main class="card"><h1>⚡ Upgrade APK Limit</h1><p>Free limit खत्म होने के बाद admin से extra APK builds माँगें.</p><label>Extra APK कितने चाहिए?</label><input id="extra" type="number" min="1" max="100" value="2"><label>Message</label><textarea id="message" rows="4" placeholder="Please approve extra APK builds."></textarea><button id="send">Send Request</button><div id="msg"></div><p><a href="index.html">← Builder</a> · <a href="my-apps.html">My Apps</a></p></main>
<script type="module">import{auth,db}from"./js/firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
let u=null;const $=id=>document.getElementById(id);onAuthStateChanged(auth,x=>{u=x;if(!u)location.href="login.html"});$("send").onclick=async()=>{if(!u)return;const extra=Math.max(1,Math.min(100,Number($("extra").value||2)));try{const us=await getDoc(doc(db,"users",u.uid)),ud=us.exists()?us.data():{};await setDoc(doc(db,"adminRequests",u.uid),{uid:u.uid,email:u.email||"",name:ud.name||u.displayName||"",count:0,requestedExtra:extra,message:$("message").value.trim(),status:"pending",createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});$("msg").textContent="✅ Request admin को भेज दी गई है.";$("msg").style.background="#effaf5"}catch(e){$("msg").textContent="❌ "+e.message;$("msg").style.background="#fff0f2"}};</script></body></html>
