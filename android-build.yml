name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name
        required: true
        default: Great India App
      website_url:
        description: Website URL
        required: true
        default: https://example.com
      package_name:
        description: Android package name
        required: true
        default: com.greatindia.app
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/${{ github.event.inputs.package_name }}
          mkdir -p android/app/src/main/res/values
          PKG="${{ github.event.inputs.package_name }}"
          PKG_PATH="${PKG//./\/}"
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GeneratedApp'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android { namespace '${PKG}'; compileSdk 35
            defaultConfig { applicationId '${PKG}'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="${{ github.event.inputs.app_name }}">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item></style></resources>
          EOF
          cat > android/app/src/main/java/${PKG_PATH}/MainActivity.java <<EOF
          package ${PKG};
          import android.app.*; import android.os.*; import android.webkit.*; import android.view.*;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.getSettings().setDomStorageEnabled(true); w.setWebViewClient(new WebViewClient()); w.loadUrl("${{ github.event.inputs.website_url }}"); setContentView(w);}
          }
          EOF
          cd android
          gradle wrapper --gradle-version 8.11.1
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
