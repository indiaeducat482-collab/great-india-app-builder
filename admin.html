```html
<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Admin Panel | Great India App Builder</title>

<style>

body{
  margin:0;
  background:#f4f7fb;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#172033;
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:22px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.top h1{
  margin:0;
}

.top a{
  color:#087f5b;
  font-weight:800;
  text-decoration:none;
}

.card{
  background:#fff;
  border:1px solid #e2e7ee;
  border-radius:16px;
  padding:17px;
  margin:15px 0;
  overflow:auto;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:10px;
}

.stat{
  background:#eef8f4;
  padding:15px;
  border-radius:12px;
}

.stat b{
  font-size:24px;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.table th,
.table td{
  border-bottom:1px solid #e5e9ef;
  padding:10px;
  text-align:left;
  vertical-align:top;
}

.table th{
  background:#f8fafc;
  font-weight:900;
}

.btn{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  font-weight:800;
  cursor:pointer;
  margin:2px;
  text-decoration:none;
  display:inline-block;
}

.ok{
  background:#087f5b;
  color:#fff;
}

.warn{
  background:#f59f00;
  color:#fff;
}

.danger{
  background:#c92a2a;
  color:#fff;
}

.gray{
  background:#edf1f6;
  color:#172033;
}

.muted{
  font-size:12px;
  color:#697586;
}

input{
  padding:8px;
  border:1px solid #ccd3dd;
  border-radius:8px;
  width:80px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.status-ready{
  background:#dff7eb;
  color:#087f5b;
}

.status-building{
  background:#fff3cd;
  color:#946200;
}

.status-failed{
  background:#ffe3e3;
  color:#c92a2a;
}

.url{
  max-width:260px;
  word-break:break-all;
}

@media(max-width:800px){

  .wrap{
    padding:12px;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .top{
    align-items:flex-start;
  }

  .top h1{
    font-size:24px;
  }

}

</style>

</head>


<body>


<main class="wrap">


<!-- HEADER -->

<div class="top">

  <h1>
    🛡️ Admin Panel
  </h1>

  <a href="index.html">
    Builder
  </a>

</div>


<!-- STATS -->

<div class="stats">


  <div class="stat">

    <b id="users">
      0
    </b>

    <br>

    Users

  </div>


  <div class="stat">

    <b id="blocked">
      0
    </b>

    <br>

    Blocked

  </div>


  <div class="stat">

    <b id="apps">
      0
    </b>

    <br>

    APK Records

  </div>


  <div class="stat">

    <b id="pending">
      0
    </b>

    <br>

    Upgrade Requests

  </div>


</div>


<!-- ALL USERS -->

<div class="card">

  <h2>
    👥 All Users
  </h2>

  <div id="usersTable">
    Loading…
  </div>

</div>


<!-- UPGRADE REQUESTS -->

<div class="card">

  <h2>
    💳 Upgrade Requests
  </h2>

  <div id="requests">
    Loading…
  </div>

</div>


<!-- ALL APPS -->

<div class="card">

  <h2>
    📱 All Apps
  </h2>

  <div id="appsTable">
    Loading…
  </div>

</div>


</main>


<!-- ADMIN JAVASCRIPT -->

<script
  type="module"
  src="./js/admin.js?v=20260907-v3">
</script>


</body>

</html>
```
