<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Great India Technology</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1d4ed8);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo h1{
  color:#1d4ed8;
  font-size:25px;
}

.logo p{
  color:#666;
  margin-top:7px;
  font-size:14px;
}

h2{
  text-align:center;
  color:#222;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  color:#333;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 2px rgba(37,99,235,.12);
}

button{
  width:100%;
  margin-top:23px;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:16px;
  padding:12px;
  border-radius:8px;
  text-align:center;
  font-size:14px;
}

.error{
  background:#fee2e2;
  color:#b91c1c;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.back{
  text-align:center;
  margin-top:20px;
}

.back a{
  color:#2563eb;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <h1>Great India Technology</h1>
    <p>Administrator Panel</p>
  </div>

  <h2>Admin Login</h2>

  <form id="loginForm">

    <label for="email">Admin Email</label>

    <input
      type="email"
      id="email"
      value="indiaeducat482@gmail.com"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginBtn">
      Login to Admin Panel
    </button>

  </form>

  <div id="errorBox" class="message error"></div>
  <div id="successBox" class="message success"></div>

  <div class="back">
    <a href="index.html">← Back to Website</a>
  </div>

</div>


<script type="module">

import { auth, db }
from "./js/firebase-config.js";

import {
  signInWithEmailAndPassword,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ==========================================
   ADMIN EMAIL
========================================== */

const ADMIN_EMAIL = "indiaeducat482@gmail.com";


const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");

const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");


/* ==========================================
   MESSAGE FUNCTIONS
========================================== */

function hideMessages(){

  errorBox.style.display = "none";
  successBox.style.display = "none";

}


function showError(message){

  errorBox.textContent = message;
  errorBox.style.display = "block";
  successBox.style.display = "none";

}


function showSuccess(message){

  successBox.textContent = message;
  successBox.style.display = "block";
  errorBox.style.display = "none";

}


/* ==========================================
   LOGIN
========================================== */

form.addEventListener("submit", async function(e){

  e.preventDefault();

  hideMessages();

  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;


  /* Check email */

  if(email !== ADMIN_EMAIL.toLowerCase()){

    showError(
      "This account is not authorized as admin."
    );

    return;

  }


  if(!password){

    showError(
      "Please enter your admin password."
    );

    return;

  }


  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";


  try{

    /* Firebase Authentication */

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user = result.user;


    /* ======================================
       FINAL ADMIN EMAIL CHECK
    ====================================== */

    if(
      !user.email ||
      user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await signOut(auth);

      showError(
        "This account is not authorized as admin."
      );

      loginBtn.disabled = false;
      loginBtn.textContent =
        "Login to Admin Panel";

      return;

    }


    /* ======================================
       CHECK FIRESTORE USER STATUS
    ====================================== */

    try{

      const userRef =
        doc(db,"users",user.uid);

      const userSnap =
        await getDoc(userRef);


      if(userSnap.exists()){

        const userData =
          userSnap.data();


        if(userData.blocked === true){

          await signOut(auth);

          showError(
            "This admin account is blocked."
          );

          loginBtn.disabled = false;
          loginBtn.textContent =
            "Login to Admin Panel";

          return;

        }

      }

    }catch(firestoreError){

      /*
        Firestore user document missing
        should not stop Firebase admin login.
      */

      console.log(
        "Firestore status check:",
        firestoreError
      );

    }


    /* ======================================
       SUCCESS
    ====================================== */

    showSuccess(
      "Login successful. Opening Admin Panel..."
    );


    passwordInput.value = "";


    setTimeout(function(){

      window.location.replace("admin.html");

    },700);


  }catch(error){

    console.error(
      "Admin Login Error:",
      error
    );


    let message =
      "Invalid admin email or password.";


    switch(error.code){

      case "auth/invalid-credential":

        message =
          "Invalid admin email or password.";

        break;


      case "auth/wrong-password":

        message =
          "Wrong admin password.";

        break;


      case "auth/user-not-found":

        message =
          "Admin account not found in Firebase.";

        break;


      case "auth/invalid-email":

        message =
          "Invalid admin email.";

        break;


      case "auth/too-many-requests":

        message =
          "Too many login attempts. Please try again later.";

        break;


      case "auth/network-request-failed":

        message =
          "Firebase connection failed. Check your internet.";

        break;


      case "auth/user-disabled":

        message =
          "This Firebase account has been disabled.";

        break;

    }


    showError(message);


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login to Admin Panel";

  }

});

</script>

</body>
</html>
