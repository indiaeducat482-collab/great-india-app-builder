<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Great India App Builder</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e2e7ee;border-radius:20px;padding:28px;box-shadow:0 12px 35px #17203314}.brand{font-weight:900;color:#087f5b;font-size:20px;margin-bottom:22px}.shield{text-align:center;font-size:48px;margin-bottom:8px}h1{text-align:center;margin:0 0 6px}p{color:#697586;text-align:center}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input{width:100%;height:48px;border:1px solid #ccd4df;border-radius:11px;padding:0 12px;font:inherit}.btn{width:100%;height:48px;border:0;border-radius:11px;background:#087f5b;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.msg{margin:12px 0;padding:11px;border-radius:10px;background:#fff0f2;color:#9b1238;display:none}.back{text-align:center;margin-top:18px}.back a{color:#087f5b;font-weight:800;text-decoration:none}</style></head>
<body><main class="card"><div class="brand">🚀 Great India App Builder</div><div class="shield">🛡️</div><h1>Admin Login</h1><p>Admin panel access</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label>Admin Email</label><input id="email" type="email" autocomplete="username" required placeholder="admin@greatindia.technology"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter admin password"></div><button id="btn" class="btn" type="submit">Login as Admin</button></form><div class="back"><a href="index.html">← Back to App Builder</a></div></main><script type="module">import{auth}from"./js/firebase-config.js";import{signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";const ADMIN_EMAIL="admin@greatindia.technology";const $=id=>document.getElementById(id);$("form").onsubmit=async e=>{e.preventDefault();$("btn").disabled=true;$("msg").style.display="none";try{const email=$("email").value.trim().toLowerCase();if(email!==ADMIN_EMAIL)throw Error("This account is not authorized as admin.");await signInWithEmailAndPassword(auth,email,$("password").value);location.href="admin.html"}catch(err){$("msg").textContent="❌ "+(err.code==="auth/invalid-credential"?"Invalid admin email or password.":err.message);$("msg").style.display="block";$("btn").disabled=false}};</script></body></html>
