<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Login | Great India App Builder</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#f4f7fb;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:#172033;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(430px,100%);
  background:#fff;
  border:1px solid #e2e7ee;
  border-radius:20px;
  padding:28px;
  box-shadow:0 12px 35px #17203314;
}

.brand{
  font-weight:900;
  color:#087f5b;
  font-size:20px;
  margin-bottom:22px;
}

.shield{
  text-align:center;
  font-size:48px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  margin:0 0 6px;
}

.subtitle{
  color:#697586;
  text-align:center;
}

.field{
  margin:16px 0;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:48px;
  border:1px solid #ccd4df;
  border-radius:11px;
  padding:0 12px;
  font:inherit;
  outline:none;
}

.field input:focus{
  border-color:#087f5b;
  box-shadow:0 0 0 3px #087f5b18;
}

.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:11px;
  background:#087f5b;
  color:#fff;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.msg{
  margin:12px 0;
  padding:11px;
  border-radius:10px;
  background:#fff0f2;
  color:#9b1238;
  display:none;
  font-weight:700;
}

.success{
  background:#effaf5;
  color:#087f5b;
}

.back{
  text-align:center;
  margin-top:18px;
}

.back a{
  color:#087f5b;
  font-weight:800;
  text-decoration:none;
}
</style>
</head>

<body>

<main class="card">

  <div class="brand">
    🚀 Great India App Builder
  </div>

  <div class="shield">
    🛡️
  </div>

  <h1>Admin Login</h1>

  <p class="subtitle">
    Admin panel access
  </p>

  <div id="msg" class="msg"></div>

  <form id="form">

    <div class="field">

      <label for="email">
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        value="indiaeducat482@gmail.com"
        autocomplete="username"
        required
      >

    </div>

    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Enter admin password"
      >

    </div>

    <button
      id="btn"
      class="btn"
      type="submit"
    >
      Login as Admin
    </button>

  </form>

  <div class="back">
    <a href="index.html">
      ← Back to App Builder
    </a>
  </div>

</main>


<script type="module">

import {
  auth,
  db
} from "./js/firebase-config.js";

import {
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   AUTHORIZED ADMIN
========================= */

const ADMIN_EMAIL =
  "indiaeducat482@gmail.com";


const $ = id =>
  document.getElementById(id);


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success = false
){

  const msg = $("msg");

  msg.textContent = text;

  msg.className =
    success
      ? "msg success"
      : "msg";

  msg.style.display = "block";
}


/* =========================
   CHECK CURRENT LOGIN
========================= */

onAuthStateChanged(
  auth,
  user => {

    if (!user) return;

    const email =
      String(
        user.email || ""
      )
      .trim()
      .toLowerCase();

    if (
      email ===
      ADMIN_EMAIL.toLowerCase()
    ){

      location.href =
        "admin.html";

    }

  }
);


/* =========================
   ADMIN LOGIN
========================= */

$("form").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const btn =
      $("btn");

    const email =
      $("email")
        .value
        .trim()
        .toLowerCase();

    const password =
      $("password")
        .value;


    /* =========================
       EMAIL AUTHORIZATION
    ========================= */

    if (
      email !==
      ADMIN_EMAIL.toLowerCase()
    ){

      showMessage(
        "❌ This account is not authorized as admin."
      );

      return;

    }


    if (!password){

      showMessage(
        "❌ Please enter admin password."
      );

      return;

    }


    btn.disabled = true;

    btn.textContent =
      "Checking...";

    $("msg").style.display =
      "none";


    try {

      /* =========================
         FIREBASE AUTH
      ========================= */

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        result.user;


      /* =========================
         FINAL EMAIL CHECK
      ========================= */

      const loggedEmail =
        String(
          user.email || ""
        )
        .trim()
        .toLowerCase();


      if (
        loggedEmail !==
        ADMIN_EMAIL.toLowerCase()
      ){

        await signOut(auth);

        throw new Error(
          "This account is not authorized as admin."
        );

      }


      /* =========================
         OPTIONAL BLOCK CHECK
      ========================= */

      try {

        const userDoc =
          await getDoc(
            doc(
              db,
              "users",
              user.uid
            )
          );


        if (
          userDoc.exists() &&
          userDoc.data().blocked === true
        ){

          await signOut(auth);

          throw new Error(
            "This admin account is blocked."
          );

        }

      } catch(profileError){

        console.warn(
          "Admin profile check:",
          profileError
        );

      }


      /* =========================
         SUCCESS
      ========================= */

      showMessage(
        "✅ Admin login successful. Opening Admin Panel...",
        true
      );

      btn.textContent =
        "Opening Admin Panel...";


      setTimeout(
        () => {

          location.href =
            "admin.html";

        },
        500
      );


    } catch(error){

      console.error(
        "Admin Login Error:",
        error
      );


      let message =
        "Login failed.";


      if (
        error.code ===
        "auth/invalid-credential"
      ){

        message =
          "Invalid admin email or password.";

      }
      else if (
        error.code ===
        "auth/wrong-password"
      ){

        message =
          "Invalid admin email or password.";

      }
      else if (
        error.code ===
        "auth/user-not-found"
      ){

        message =
          "Admin account not found in Firebase Authentication.";

      }
      else if (
        error.code ===
        "auth/too-many-requests"
      ){

        message =
          "Too many login attempts. Please try again later.";

      }
      else if(error.message){

        message =
          error.message;

      }


      showMessage(
        "❌ " + message
      );


      btn.disabled = false;

      btn.textContent =
        "Login as Admin";

    }

  }
);

</script>

</body>
</html>
