<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Great India App Builder</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:Arial,system-ui,sans-serif;
      background:#f4f7fb;
      color:#172033;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:430px;
      background:#fff;
      padding:30px;
      border-radius:20px;
      border:1px solid #e2e7ee;
      box-shadow:0 12px 40px rgba(0,0,0,.08);
    }

    .logo{
      width:72px;
      height:72px;
      border-radius:18px;
      margin:0 auto 15px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#087f5b;
      color:#fff;
      font-size:34px;
      font-weight:900;
    }

    h1{
      text-align:center;
      margin:0;
      font-size:27px;
    }

    .subtitle{
      text-align:center;
      color:#687386;
      margin:8px 0 25px;
    }

    label{
      display:block;
      font-weight:700;
      margin:12px 0 6px;
    }

    input{
      width:100%;
      height:48px;
      border:1px solid #d4dae3;
      border-radius:10px;
      padding:0 13px;
      font:inherit;
      outline:none;
    }

    input:focus{
      border-color:#087f5b;
      box-shadow:0 0 0 3px rgba(8,127,91,.12);
    }

    button{
      width:100%;
      height:48px;
      margin-top:18px;
      border:0;
      border-radius:10px;
      background:#087f5b;
      color:#fff;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .msg{
      display:none;
      margin:15px 0;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      line-height:1.4;
    }

    .msg.show{
      display:block;
    }

    .error{
      background:#fff0f2;
      color:#9b1238;
    }

    .success{
      background:#edf9f3;
      color:#126b43;
    }

    .links{
      text-align:center;
      margin-top:20px;
      line-height:2;
    }

    a{
      color:#087f5b;
      font-weight:800;
      text-decoration:none;
    }

    .status{
      text-align:center;
      margin-top:14px;
      color:#687386;
      font-size:12px;
    }
  </style>
</head>

<body>

<main class="card">

  <div class="logo">GI</div>

  <h1>🔐 Login</h1>
  <div class="subtitle">Great India App Builder</div>

  <div id="msg" class="msg"></div>

  <label for="email">Email</label>
  <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="Enter your email"
  >

  <label for="password">Password</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Enter your password"
  >

  <button id="login" type="button">
    Login
  </button>

  <div class="links">
    <a href="register.html">Create account</a>
    &nbsp;·&nbsp;
    <a href="#" id="forgot">Forgot password?</a>
  </div>

  <div id="status" class="status">
    Connecting to secure login...
  </div>

</main>

<script type="module">
  /*
   * IMPORTANT:
   * The page UI is normal HTML and therefore remains visible
   * even if Firebase cannot load.
   */

  const status = document.getElementById("status");
  const msg = document.getElementById("msg");

  function showMessage(text, type = "error"){
    msg.textContent = text;
    msg.className = "msg show " + type;
  }

  function setStatus(text){
    if(status) status.textContent = text;
  }

  let authModule = null;

  try {
    authModule = await import("./js/auth.js?v=20260907");
    setStatus("Secure login ready.");
  } catch(error) {
    console.error("Authentication module failed:", error);

    setStatus("Login service could not be loaded.");

    showMessage(
      "Login system could not load. Please refresh the page. If the problem continues, check the browser console.",
      "error"
    );
  }

  document.getElementById("login").addEventListener("click", async () => {

    if(!authModule){
      showMessage("Login service is not available. Please refresh the page.");
      return;
    }

    if(typeof authModule.loginUser !== "function"){
      showMessage("Login module is outdated. Please refresh the page.");
      return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(!email || !password){
      showMessage("Please enter email and password.");
      return;
    }

    const button = document.getElementById("login");

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
      await authModule.loginUser(email, password);

      setStatus("Login successful. Opening App Builder...");

      window.location.replace("index.html?v=20260907");

    } catch(error) {

      console.error("Login error:", error);

      showMessage(
        authModule.getFriendlyError
          ? authModule.getFriendlyError(error)
          : "Login failed. Please check your email and password."
      );

      button.disabled = false;
      button.textContent = "Login";
    }
  });

  document.getElementById("forgot").addEventListener("click", async (event) => {

    event.preventDefault();

    if(!authModule){
      showMessage("Login service is not available. Please refresh the page.");
      return;
    }

    const email = document.getElementById("email").value.trim();

    if(!email){
      showMessage("Enter your email first.");
      return;
    }

    try {

      await authModule.resetPassword(email);

      showMessage(
        "Password reset email sent. Please check your inbox.",
        "success"
      );

    } catch(error) {

      console.error("Password reset error:", error);

      showMessage(
        authModule.getFriendlyError
          ? authModule.getFriendlyError(error)
          : "Could not send password reset email."
      );
    }
  });
</script>

</body>
</html>
