<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Apps | Great India App Builder</title>
<style>body{margin:0;background:#f4f7fb;font-family:system-ui;color:#172033}.wrap{max-width:1050px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center}.top a{font-weight:800;color:#087f5b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:17px}.logo{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#edf1f6}.btn{display:block;text-align:center;background:#087f5b;color:#fff;padding:11px;border-radius:9px;text-decoration:none;font-weight:900;margin-top:10px}.muted{color:#697586;font-size:13px}</style></head><body><main class="wrap"><div class="top"><h1>📱 My Apps</h1><a href="index.html">← Builder</a></div><p class="muted">आपके द्वारा बनाए गए सभी APK builds यहाँ सेव रहेंगे.</p><div id="list">Loading…</div></main>
<script type="module">
import{auth,db}from"./js/firebase-config.js";import{onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import{collection,query,where,getDocs,orderBy}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const list=document.getElementById("list"),esc=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}try{
const s=await getDocs(query(collection(db,"appHistory"),where("uid","==",u.uid),orderBy("createdAt","desc")));
if(s.empty){list.innerHTML="<div class='card'>अभी कोई APK नहीं बना है.</div>";return}
list.innerHTML="";s.forEach(x=>{const d=x.data(),el=document.createElement("div");el.className="card";const date=d.createdAt?.toDate?d.createdAt.toDate().toLocaleString():"";el.innerHTML=`<img class="logo" src="${d.logoData||""}" onerror="this.style.display='none'"><h2>${esc(d.name)}</h2><div class="muted">${esc(d.targetUrl)}<br>${esc(date)}<br>Status: ${esc(d.status||"queued")}</div>${d.apkUrl?`<a class="btn" href="${esc(d.apkUrl)}" target="_blank">⬇️ Download APK</a>`:"<div class='muted' style='margin-top:10px'>Build status: APK URL मिलने पर यहाँ Download दिखाई देगा.</div>"}`;list.appendChild(el)})}
catch(e){list.innerHTML="<div class='card'>❌ "+esc(e.message)+"</div>"}});</script></body></html>
